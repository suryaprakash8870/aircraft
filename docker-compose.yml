services:
  db:
    image: postgres:16-alpine
    container_name: fuel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuel_user
      POSTGRES_PASSWORD: fuel_pass
      POSTGRES_DB: fuel_management
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel_user -d fuel_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuel_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://fuel_user:fuel_pass@db:5432/fuel_management
      SECRET_KEY: change-this-to-a-secure-random-string-min-32-chars-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      COMPANY_NAME: AeroFuel Management
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuel_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
